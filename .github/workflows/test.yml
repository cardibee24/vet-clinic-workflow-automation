name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vetclinic
          POSTGRES_PASSWORD: vetclinic
          POSTGRES_DB: vetclinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetclinic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://vetclinic:vetclinic@localhost:5432/vetclinic
      JWT_SECRET_KEY: ci-test-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
