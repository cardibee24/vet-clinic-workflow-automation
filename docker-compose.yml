services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vet-clinic-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vetclinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetclinic}
      POSTGRES_DB: ${POSTGRES_DB:-vetclinic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vetclinic}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vet-clinic-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # Placeholder only - no Celery broker/backend wired up yet.

  backend:
    build: ./backend
    container_name: vet-clinic-backend
    env_file: ./backend/.env
    environment:
      # Overrides the .env value so the app reaches Postgres via the
      # compose network instead of localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vetclinic}:${POSTGRES_PASSWORD:-vetclinic}@postgres:5432/${POSTGRES_DB:-vetclinic}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: vet-clinic-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
